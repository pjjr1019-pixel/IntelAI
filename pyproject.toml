[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intel-ai"
version = "0.1.0"
description = "Pre-Event Anomaly Detection — OSINT & Predictive Intelligence"
requires-python = ">=3.10"
license = {text = "Proprietary"}

dependencies = [
    # ── ORM & Database ─────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29",           # async Postgres driver
    "psycopg2-binary>=2.9",    # sync driver (Alembic)
    "alembic>=1.13",
    # ── Validation ─────────────────────────────────────────
    "pydantic>=2.5,<3.0",
    # ── Configuration ──────────────────────────────────────
    "python-dotenv>=1.0",
    # ── Ingestion Engine ───────────────────────────────────
    "pytrends>=4.9",           # Google Trends unofficial API
    "aiohttp>=3.9",            # async HTTP for Wikipedia / future APIs    # ── Anomaly Detection Engine ───────────────────────────────────────
    "numpy>=1.26",
    "statsmodels>=0.14",       # STL decomposition
    "scikit-learn>=1.4",       # Isolation Forest
    # ── API Backend ────────────────────────────────────────
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    # ── Semantic Engine (Phase 2) ────────────────────────────
    "sentence-transformers>=2.3",
    "hdbscan>=0.8",
    # ── Reddit Connector ────────────────────────────────────
    "asyncpraw>=7.7",
    # ── WebSocket ───────────────────────────────────────────
    "websockets>=12.0",
    # ── Auth ─────────────────────────────────────────────────
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    "prometheus-client>=0.20",
    # ── SQLite async (desktop / testing) ─────────────────────
    "aiosqlite>=0.17",
    # ── Export & Reporting ───────────────────────────────────
    "pandas>=2.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "matplotlib>=3.8",
    # ── Email Templates ─────────────────────────────────────
    "jinja2>=3.1",
    # ── Trading & Market Data ───────────────────────────────
    "alpaca-py>=0.28",
    # ── Scheduling ──────────────────────────────────────────
    "APScheduler>=3.10",
]

[project.optional-dependencies]
desktop = [
    "pyinstaller>=6.0",
    "pystray>=0.19",
    "Pillow>=10.0",
    "winotify>=1.1",
    "websocket-client>=1.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.17",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.8",
    "watchdog>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
vanguard-desktop = "vanguard_signal.desktop.launcher:main"

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true

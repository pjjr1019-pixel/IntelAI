<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" fill="url(#bgGradient)" rx="24" ry="24"/>

  <!-- Geometric accent elements -->
  <circle cx="38" cy="38" r="11" fill="#3b82f6" opacity="0.3"/>
  <circle cx="154" cy="154" r="9" fill="#06b6d4" opacity="0.3"/>
  <rect x="19" y="170" width="15" height="2" fill="#8b5cf6" opacity="0.4" rx="1"/>
  <rect x="158" y="19" width="13" height="2" fill="#3b82f6" opacity="0.4" rx="1"/>

  <!-- Main text -->
  <text x="96" y="82" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">Intel</text>
  <text x="96" y="105" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">AI</text>

  <!-- Tech circuit pattern -->
  <g opacity="0.2" stroke="#3b82f6" stroke-width="0.5" fill="none">
    <path d="M57 133 L75 133 L75 152"/>
    <path d="M117 133 L135 133 L135 152"/>
    <circle cx="75" cy="133" r="1"/>
    <circle cx="135" cy="133" r="1"/>
  </g>
</svg>
name: Run Live Trending Tests

on:
  workflow_dispatch:

jobs:
  live-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run live trending fallback test
        env:
          VS_DB_MODE: sqlite
          RUN_LIVE_TESTS: '1'
        run: |
          python -m pytest tests/test_trending_fallback.py -q
